<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Your balance</title>

<!--
  Balance Book client-facing balance page.

  Read-only by construction. It performs exactly one HTTP GET, against a single
  Firestore document keyed by the share id in the URL. There is no write path
  here, no sign-in, and no way to reach anything else: the security rules allow
  `get` on this collection but deny `list`, so the id in the address is the only
  thing that resolves.

  No SDK, no CDN, no build step. The whole page is this file, which also means
  it keeps working regardless of what happens to a third-party script host.

  The API key below is a public Firebase browser key. It identifies the project
  for quota purposes and grants no access on its own; what may be read is
  decided entirely by firestore.rules.
-->

<style>
  :root {
    color-scheme: light dark;

    --bg: #f5f6f8;
    --surface: #ffffff;
    --sunken: #f1f2f5;
    --line: #e5e7eb;
    --fg: #0d1117;
    --muted: #656d79;

    --brand: #4f46e5;
    --brand-2: #6d28d9;
    --charge: #b45309;
    --charge-bg: #fef6e7;
    --payment: #047857;
    --payment-bg: #ecfdf5;
    --credit: #0369a1;
    --credit-bg: #f0f9ff;

    --radius: 16px;
    --shadow: 0 1px 2px rgb(16 24 40 / .04), 0 1px 3px rgb(16 24 40 / .06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0b0e;
      --surface: #141619;
      --sunken: #21252b;
      --line: #262a31;
      --fg: #e9eaee;
      --muted: #9aa1ad;

      --brand: #6366f1;
      --brand-2: #5b21b6;
      --charge: #fbbf24;
      --charge-bg: #2a1e05;
      --payment: #34d399;
      --payment-bg: #06251c;
      --credit: #38bdf8;
      --credit-bg: #071e2c;

      --shadow: 0 1px 2px rgb(0 0 0 / .4);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 56px; }

  .tnum { font-variant-numeric: tabular-nums; }

  /* --- hero ------------------------------------------------------------ */

  .hero {
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
    border-radius: 20px;
    padding: 24px 20px;
    color: #fff;
  }
  .hero .who { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
  .hero .co { opacity: .85; font-size: 14px; margin-top: 2px; }
  .hero .label {
    margin-top: 20px;
    font-size: 13px;
    font-weight: 600;
    opacity: .85;
  }
  .hero .amount {
    font-size: clamp(38px, 12vw, 52px);
    font-weight: 800;
    letter-spacing: -1.5px;
    line-height: 1.05;
    margin-top: 4px;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgb(255 255 255 / .18);
    font-size: 13px;
    font-weight: 700;
  }

  /* --- cards ----------------------------------------------------------- */

  h2 {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--muted);
    margin: 28px 4px 10px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
  }
  .row + .row { border-top: 1px solid var(--line); }
  .row .grow { flex: 1; min-width: 0; }
  .row .title { font-weight: 600; }
  .row .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .row .val { font-weight: 700; white-space: nowrap; }
  .row .after { font-size: 12px; color: var(--muted); margin-top: 2px; text-align: right; }

  .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .tag {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    background: var(--sunken);
    color: var(--muted);
  }
  .tag.charge  { background: var(--charge-bg);  color: var(--charge); }
  .tag.payment { background: var(--payment-bg); color: var(--payment); }

  .amt.charge  { color: var(--charge); }
  .amt.payment { color: var(--payment); }
  .amt.reversed { text-decoration: line-through; color: var(--muted); }

  .totals { display: flex; text-align: center; }
  .totals > div { flex: 1; padding: 14px 8px; }
  .totals > div + div { border-left: 1px solid var(--line); }
  .totals .k { font-size: 12px; color: var(--muted); }
  .totals .v { font-weight: 700; margin-top: 3px; }

  .daygroup { margin-top: 18px; }
  .dayhead {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    margin: 0 4px 8px;
  }

  .foot {
    margin-top: 26px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
  }
  .foot button {
    background: none;
    border: 0;
    color: var(--muted);
    font: inherit;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
  }

  /* --- id prompt / states ---------------------------------------------- */

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 28px 22px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .panel h1 { font-size: 21px; margin: 0 0 8px; letter-spacing: -.3px; }
  .panel p { color: var(--muted); margin: 0 0 20px; font-size: 15px; }

  .mark {
    width: 54px; height: 54px;
    margin: 0 auto 18px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
    display: grid; place-items: center;
    color: #fff; font-size: 24px;
  }

  input[type=text] {
    width: 100%;
    padding: 15px 16px;
    font: 16px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--fg);
    background: var(--sunken);
    border: 1px solid var(--line);
    border-radius: 12px;
    outline: none;
  }
  input[type=text]:focus { border-color: var(--brand); }

  button.primary {
    width: 100%;
    margin-top: 12px;
    padding: 15px;
    font: 600 16px/1 inherit;
    color: #fff;
    background: var(--brand);
    border: 0;
    border-radius: 12px;
    cursor: pointer;
  }
  button.primary:disabled { opacity: .5; cursor: default; }

  .err { color: var(--charge); font-size: 14px; margin-top: 14px; }

  .skeleton {
    background: var(--sunken);
    border-radius: 8px;
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: .5 } 50% { opacity: .9 } }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  [hidden] { display: none !important; }
</style>
</head>

<body>
<div class="wrap">

  <!-- Asks for the id when the URL has none. -->
  <section id="gate" hidden>
    <div class="panel">
      <div class="mark">&#128179;</div>
      <h1>View your balance</h1>
      <p>Enter the code from the link you were sent.</p>
      <form id="gate-form" autocomplete="off">
        <input id="gate-input" type="text" inputmode="text" spellcheck="false"
               placeholder="Your code" aria-label="Your code">
        <button class="primary" type="submit">View balance</button>
      </form>
      <div class="err" id="gate-error" hidden></div>
    </div>
  </section>

  <section id="loading" hidden>
    <div class="hero">
      <div class="skeleton" style="height:18px;width:52%;background:rgb(255 255 255/.25)"></div>
      <div class="skeleton" style="height:44px;width:70%;margin-top:22px;background:rgb(255 255 255/.25)"></div>
    </div>
  </section>

  <section id="error" hidden>
    <div class="panel">
      <div class="mark">&#9888;</div>
      <h1 id="error-title">Link not found</h1>
      <p id="error-body"></p>
      <button class="primary" id="error-retry" type="button">Try again</button>
    </div>
  </section>

  <main id="view" hidden></main>
</div>

<script>
(() => {
  "use strict";

  // Fill these in from your own Firebase project:
  //   Firebase console -> Project settings -> Your apps -> Web app
  // Both values are public browser credentials. They identify the project and
  // grant nothing on their own. What may be read is decided entirely by
  // firestore.rules, which allows `get` on a single publicLedgers document and
  // denies `list`.
  const CONFIG = {
    projectId: "YOUR_FIREBASE_PROJECT_ID",
    apiKey: "YOUR_FIREBASE_WEB_API_KEY",
  };

  const STORAGE_KEY = "balancebook.shareId";

  const el = (id) => document.getElementById(id);
  const show = (id) => { el(id).hidden = false; };
  const hide = (id) => { el(id).hidden = true; };
  const only = (id) => {
    for (const s of ["gate", "loading", "error", "view"]) {
      el(s).hidden = s !== id;
    }
  };

  // --- Firestore REST decoding ------------------------------------------
  // The REST API returns values wrapped in a type tag. Unwrap recursively so
  // the rest of the page works with plain JS values.

  function decode(value) {
    if (value === null || value === undefined) return null;
    if ("nullValue" in value) return null;
    if ("stringValue" in value) return value.stringValue;
    if ("booleanValue" in value) return value.booleanValue;
    if ("integerValue" in value) return Number(value.integerValue);
    if ("doubleValue" in value) return value.doubleValue;
    if ("timestampValue" in value) return new Date(value.timestampValue);
    if ("arrayValue" in value) {
      return (value.arrayValue.values || []).map(decode);
    }
    if ("mapValue" in value) return decodeFields(value.mapValue.fields || {});
    return null;
  }

  function decodeFields(fields) {
    const out = {};
    for (const key of Object.keys(fields)) out[key] = decode(fields[key]);
    return out;
  }

  // --- money -------------------------------------------------------------
  // Amounts arrive as integer minor units, exactly as they are stored. All
  // arithmetic stays in integers; only the final split into major/minor uses
  // division, so nothing here can drift.

  const CURRENCIES = {
    INR: { symbol: "₹", locale: "en-IN" },
    USD: { symbol: "$",      locale: "en-US" },
    EUR: { symbol: "€", locale: "de-DE" },
    GBP: { symbol: "£", locale: "en-GB" },
    AED: { symbol: "AED ",   locale: "en-US" },
  };

  let currency = CURRENCIES.INR;

  function money(minor, { signed = false, absolute = false } = {}) {
    const negative = minor < 0;
    const abs = Math.abs(minor);
    const major = Math.trunc(abs / 100);
    const cents = abs % 100;

    let out = "";
    if (!absolute) {
      if (negative) out += "−";           // proper minus sign
      else if (signed && minor !== 0) out += "+";
    }
    out += currency.symbol;
    out += new Intl.NumberFormat(currency.locale).format(major);
    if (cents !== 0) out += "." + String(cents).padStart(2, "0");
    return out;
  }

  // --- dates -------------------------------------------------------------

  const DAY = new Intl.DateTimeFormat(undefined, {
    day: "numeric", month: "short", year: "numeric",
  });
  const TIME = new Intl.DateTimeFormat(undefined, {
    hour: "numeric", minute: "2-digit",
  });

  function sameDay(a, b) {
    return a.getFullYear() === b.getFullYear()
        && a.getMonth() === b.getMonth()
        && a.getDate() === b.getDate();
  }

  function dayHeading(date) {
    const now = new Date();
    if (sameDay(date, now)) return "Today";
    const yesterday = new Date(now);
    yesterday.setDate(now.getDate() - 1);
    if (sameDay(date, yesterday)) return "Yesterday";
    return DAY.format(date);
  }

  const escape = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));

  // --- fetch -------------------------------------------------------------

  async function loadLedger(shareId) {
    const url = `https://firestore.googleapis.com/v1/projects/${CONFIG.projectId}`
              + `/databases/(default)/documents/publicLedgers/`
              + `${encodeURIComponent(shareId)}?key=${CONFIG.apiKey}`;

    const response = await fetch(url, { cache: "no-store" });

    if (response.status === 404 || response.status === 403) {
      const err = new Error("not-found");
      err.kind = "not-found";
      throw err;
    }
    if (!response.ok) {
      const err = new Error("http-" + response.status);
      err.kind = "network";
      throw err;
    }

    const body = await response.json();
    if (!body.fields) {
      const err = new Error("empty");
      err.kind = "not-found";
      throw err;
    }
    return decodeFields(body.fields);
  }

  // --- render ------------------------------------------------------------

  function statusOf(balance) {
    if (balance > 0) return { word: "outstanding", label: "Amount pending", icon: "↑" };
    if (balance < 0) return { word: "in credit",   label: "Credit balance", icon: "↓" };
    return { word: "settled", label: "Nothing pending", icon: "✓" };
  }

  function renderHero(data) {
    const balance = data.currentBalance || 0;
    const status = statusOf(balance);

    return `
      <section class="hero">
        <div class="who">${escape(data.clientName)}</div>
        ${data.companyName ? `<div class="co">${escape(data.companyName)}</div>` : ""}
        <div class="label">${status.label}</div>
        <div class="amount tnum">${money(balance, { absolute: true })}</div>
        <div class="pill"><span>${status.icon}</span> ${
          balance === 0 ? "Fully settled" : status.word
        }</div>
      </section>

      <div class="card" style="margin-top:14px">
        <div class="totals">
          <div><div class="k">Total charged</div>
               <div class="v tnum">${money(data.totalCharged || 0, { absolute: true })}</div></div>
          <div><div class="k">Total paid</div>
               <div class="v tnum">${money(data.totalPaid || 0, { absolute: true })}</div></div>
        </div>
      </div>`;
  }

  function renderProjects(projects) {
    const rows = (projects || []).filter((p) => p.entries > 0);
    if (rows.length === 0) return "";

    return `
      <h2>By project</h2>
      <div class="card">
        ${rows.map((p) => `
          <div class="row">
            <div class="grow">
              <div class="title ellipsis">${escape(p.name)}</div>
              <div class="sub">${p.entries} ${p.entries === 1 ? "entry" : "entries"}
                &middot; ${money(p.charged || 0, { absolute: true })} charged
                &middot; ${money(p.paid || 0, { absolute: true })} paid</div>
            </div>
            <div style="text-align:right">
              <div class="val tnum">${money(p.pending || 0, { absolute: true })}</div>
              <div class="after">${
                p.pending > 0 ? "pending" : p.pending < 0 ? "in credit" : "settled"
              }</div>
            </div>
          </div>`).join("")}
      </div>`;
  }

  function renderHistory(transactions, truncated) {
    const list = transactions || [];
    if (list.length === 0) {
      return `<h2>History</h2>
        <div class="card"><div class="row"><div class="grow sub"
          style="padding:6px 0">Nothing recorded yet.</div></div></div>`;
    }

    // Already newest-first from the snapshot; group runs of the same day.
    let html = "<h2>History</h2>";
    let currentDay = null;
    let open = false;

    for (const tx of list) {
      const when = tx.createdAt instanceof Date ? tx.createdAt : null;
      const heading = when ? dayHeading(when) : "Pending";

      if (heading !== currentDay) {
        if (open) html += "</div></div>";
        currentDay = heading;
        html += `<div class="daygroup"><div class="dayhead">${escape(heading)}</div><div class="card">`;
        open = true;
      }

      const delta = tx.delta || 0;
      const isPayment = delta < 0;
      const cls = isPayment ? "payment" : "charge";
      const label = tx.note && tx.note.trim()
        ? tx.note
        : ({
            opening: "Opening balance",
            charge: "Charge",
            payment: "Payment",
            adjustment: "Adjustment",
            reversal: "Reversal",
          }[tx.type] || "Entry");

      html += `
        <div class="row">
          <div class="grow">
            <div class="title ellipsis">${escape(label)}</div>
            <div class="sub">
              <span class="tag ${cls}">${isPayment ? "Payment" : "Charge"}</span>
              ${tx.projectName ? " &middot; " + escape(tx.projectName) : ""}
              ${when ? " &middot; " + escape(TIME.format(when)) : ""}
              ${tx.isReversed ? ' &middot; <span class="tag">Reversed</span>' : ""}
            </div>
          </div>
          <div style="text-align:right">
            <div class="val tnum amt ${cls} ${tx.isReversed ? "reversed" : ""}">
              ${isPayment ? "−" : "+"}${money(Math.abs(delta), { absolute: true })}
            </div>
            <div class="after tnum">${money(tx.runningBalance || 0, { absolute: true })}</div>
          </div>
        </div>`;
    }
    if (open) html += "</div></div>";

    if (truncated) {
      html += `<div class="foot">Showing the most recent entries only.</div>`;
    }
    return html;
  }

  function render(data) {
    currency = CURRENCIES[data.currency] || CURRENCIES.INR;

    const updated = data.updatedAt instanceof Date
      ? `${DAY.format(data.updatedAt)} at ${TIME.format(data.updatedAt)}`
      : "just now";

    el("view").innerHTML =
      renderHero(data)
      + renderProjects(data.projects)
      + renderHistory(data.transactions, data.historyTruncated)
      + `<div class="foot">
           Last updated ${escape(updated)}.<br>
           This page is read-only. If something looks wrong, contact
           the sender directly.<br>
           <button type="button" id="forget">Forget this device</button>
         </div>`;

    document.title = `${data.clientName} balance`;

    el("forget").addEventListener("click", () => {
      try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
      location.href = location.pathname;
    });

    only("view");
  }

  function fail(kind) {
    if (kind === "not-found") {
      el("error-title").textContent = "Link not found";
      el("error-body").textContent =
        "This link may have been revoked, or the code was mistyped. "
        + "Ask the sender for a new one.";
      el("error-retry").textContent = "Enter a different code";
      el("error-retry").onclick = () => {
        try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
        location.href = location.pathname;
      };
    } else {
      el("error-title").textContent = "Could not load";
      el("error-body").textContent =
        "Check your internet connection and try again.";
      el("error-retry").textContent = "Try again";
      el("error-retry").onclick = () => location.reload();
    }
    only("error");
  }

  async function open(shareId) {
    only("loading");
    try {
      const data = await loadLedger(shareId);
      try { localStorage.setItem(STORAGE_KEY, shareId); } catch (_) {}
      render(data);
    } catch (error) {
      fail(error.kind || "network");
    }
  }

  // --- boot --------------------------------------------------------------

  function start() {
    if (CONFIG.projectId.startsWith("YOUR_")) {
      el("error-title").textContent = "Not configured yet";
      el("error-body").textContent =
        "Set projectId and apiKey at the top of ledger.html to your Firebase "
        + "project, then reload.";
      el("error-retry").hidden = true;
      only("error");
      return;
    }

    const fromUrl = new URLSearchParams(location.search).get("id");
    let saved = null;
    try { saved = localStorage.getItem(STORAGE_KEY); } catch (_) {}

    const shareId = (fromUrl || saved || "").trim();
    if (shareId) return open(shareId);

    only("gate");
    el("gate-input").focus();
  }

  el("gate-form").addEventListener("submit", (event) => {
    event.preventDefault();
    const value = el("gate-input").value.trim();
    if (!value) {
      el("gate-error").textContent = "Enter the code from your link.";
      show("gate-error");
      return;
    }
    hide("gate-error");
    open(value);
  });

  start();
})();
</script>
</body>
</html>
