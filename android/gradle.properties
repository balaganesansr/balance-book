org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation is disabled because its caches use
# memory-mapped .tab files that fail to close on this machine, breaking the
# build with "Could not close incremental caches" in the plugin modules
# (share_plus, url_launcher_android, shared_preferences_android). On Windows
# this is usually an antivirus holding file handles.
#
# Cost is slower incremental Kotlin rebuilds; the Dart hot-reload loop is
# unaffected. If your environment does not have the problem, delete this line.
kotlin.incremental=false
